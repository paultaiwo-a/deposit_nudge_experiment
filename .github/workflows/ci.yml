name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python run.py lint
      - run: uv run python run.py test
      - run: uv run python run.py data
      - run: uv run python run.py dbt
