[project]
name = "deposit-nudge-experiment"
version = "0.1.0"
description = "A/B test readout for a deposit-match promo, using the Hillstrom email experiment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
    "scikit-uplift>=0.5.1",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
